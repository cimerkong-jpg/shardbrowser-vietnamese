name: Build Vietnamese Windows installer

on:
  workflow_dispatch:
  push:
    branches: [vietnamese]
    paths: [.github/workflows/windows-vietnamese.yml]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-kit/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Vietnamese translations
        run: npm run check:i18n
      - name: Build installer
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          npm run build:windows -- --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ShardBrowser-TiengViet-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
